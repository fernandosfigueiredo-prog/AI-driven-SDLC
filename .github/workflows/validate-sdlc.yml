name: Validate AI-driven SDLC
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contratos, roteamento e hook (offline, sem dependências)
        run: npm test

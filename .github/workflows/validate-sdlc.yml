name: Validate AI-driven SDLC
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin and contracts (offline)
        run: python scripts/validate_sdlc.py
      - name: Test framework contracts
        run: python -m unittest discover -s tests -v
